<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>상품 설명집</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:light}[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<style>


:root {
  --bg: #faf7f3;
  --surface: #ffffff;
  --surface-2: #f2ede6;
  --ink: #241f1b;
  --ink-soft: #6b6259;
  --line: #e6ddd2;
  --line-strong: #b3a690;
  --accent: #b5502f;
  --accent-soft: #f1ded4;
  --good: #4c7a5e;
  --good-bg: #e7f0e9;
  --warn: #b8862f;
  --warn-bg: #f5ecd9;
  --crit: #b23b3b;
  --crit-bg: #f6e3e1;
  --yoy-up: #d03038;
  --yoy-down: #3068e8;
  --font-display: 'Fraunces', 'Noto Serif KR', serif;
  --font-body: 'IBM Plex Sans KR', 'Pretendard', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'IBM Plex Sans KR', monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 1600px; margin: 0 auto; padding: 28px 32px 80px; }

header.page { margin-bottom: 24px; }
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 32px;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  text-wrap: balance;
}
.sub { color: var(--ink-soft); font-size: 15.5px; }

nav.materials {
  display: flex; gap: 4px; margin: 24px 0 14px;
  border-bottom: 1px solid var(--line);
}
nav.materials button {
  font-family: var(--font-display);
  font-size: 19px; font-weight: 600;
  background: none; border: none; cursor: pointer;
  color: var(--ink-soft);
  padding: 8px 4px 12px; margin-right: 22px;
  border-bottom: 2px solid transparent;
  transition: color .15s;
}
nav.materials button.active { color: var(--accent); border-color: var(--accent); }
nav.materials button .count {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
  color: var(--ink-soft); margin-left: 6px;
}

nav.months {
  display: flex; flex-wrap: wrap; gap: 8px; margin: 0 -32px 0;
  padding: 12px 32px; position: sticky; top: var(--top-h, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
nav.months { align-items: center; justify-content: space-between; }
#monthChips { min-width: 0; }
.cat-titlerow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; margin: 24px 0 14px; border-bottom: 1px solid var(--line); }
.cat-titlerow nav.materials { margin: 0; border-bottom: none; }
.cat-titlerow .map-search { margin-bottom: 4px; }
.cat-titlerow .map-search input { width: 300px; }
.cat-top { position: sticky; top: var(--top-h, 0px); z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 0 -32px 10px; padding: 10px 32px; background: var(--bg); border-bottom: 1px solid var(--line); }
.filters-rest { display: flex; flex-direction: column; gap: 8px; }
.map-search { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.map-search input { width: 240px; max-width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.map-search-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
#mapFilters { margin: 14px 0 22px; display: flex; flex-direction: column; gap: 8px; }
#mapFilters:empty { margin: 0; }

section.week { margin-bottom: 34px; }
.week-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.week-head .wk-label {
  font-family: var(--font-display); font-weight: 600; font-size: 20px;
}
.week-head .wk-date {
  font-family: var(--font-mono); font-size: 15px;
  font-weight: 600; color: var(--accent);
}
.week-head .wk-meta { margin-left: auto; color: var(--ink-soft); font-size: 14.5px; font-family: var(--font-mono); }

.grid-link { display: block; cursor: pointer; position: relative; }
.price-up-arrow { color: #b23b3b; font-weight: 700; }
.transition-note { color: #b23b3b; font-size: 11px; font-weight: 600; margin-top: 1px; }
.price-up-badge {
  display: inline-block; background: rgba(178,59,59,.12); color: #b23b3b;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
  padding: 1px 6px; border-radius: 4px; margin-left: 2px; letter-spacing: -0.01em;
}
.review-badge {
  position: absolute; top: 5px; left: 5px; z-index: 2;
  background: rgba(178,59,59,.88); color: #fff;
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px; letter-spacing: -0.01em; pointer-events: none;
}
.grid-link:hover .color-grid { outline: 2px solid var(--accent); outline-offset: -2px; }
/* 한 줄(최대 5스타일)마다: 라벨 그리드(카드 위치별 가상 슬롯, 필요한 자리에만 스토리명 표시)와
   카드 그리드를 똑같은 5열 템플릿으로 겹쳐 쌓는다 — 그래서 카드 너비는 항상 1/5로 통일되고,
   라벨은 정확히 카드 1개 너비를 차지하며 그 스토리의 첫 카드 위치에만 나타난다. */
.week-row { margin-bottom: 22px; }
.row-label-grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px;
}
.row-card-grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px;
}
.row-label-slot {
  font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
  color: var(--accent); cursor: pointer; padding-left: 2px; line-height: 1.3; text-decoration: none; display: block;
}
.row-label-slot:hover { opacity: .75; }
.lane-cluster-grid { display: grid; gap: 10px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  min-width: 0;
}
.color-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  align-content: start;
  gap: 1px; background: var(--line); border-bottom: 1px solid var(--line);
}
.color-cell { position: relative; background: var(--surface-2); aspect-ratio: 1 / 1; }
.color-cell img {
  width: 100%; height: 100%; object-fit: contain; display: block;
}
.color-cell .noimg { width: 100%; height: 100%; background: var(--surface-2); }
.color-cell .code-tag {
  position: absolute; left: 3px; bottom: 3px;
  background: rgba(0,0,0,.55); color: #fff;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
  padding: 1px 5px; border-radius: 4px; letter-spacing: .02em;
}
.hero-top { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
.hero-info { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 2px; }
.hero-line { font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); }
.hero-line.hero-name { font-weight: 600; font-size: 13px; font-family: var(--font-body); white-space: normal; }
.hero-line.hero-kr { color: var(--ink-soft); font-family: var(--font-body); }
.hero-line.hero-code { color: var(--ink-soft); }
.hero-image { flex: 0 0 50%; }
.hero-image .color-grid { border-bottom: none; border-radius: 8px; overflow: hidden; }

.card-title { min-width: 0; padding: 10px 12px 0; }
.card-title .name-sjg {
  font-weight: 600; font-size: 15px; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.name-kr-inline { font-weight: 500; font-size: calc(1em - 2px); color: var(--ink-soft); }
.card-title .item-code {
  font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft);
  margin-top: 4px;
}
.card-title .item-code b { color: var(--ink); font-weight: 600; }

.meta-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 6px; padding: 0 12px 10px; font-size: 13px;
}
.meta-row .m-item { }
.meta-row .m-label { color: var(--ink-soft); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }
.meta-row .m-val { font-family: var(--font-mono); font-weight: 600; margin-top: 1px; }
.chip-row { display: flex; gap: 6px; margin: 0 12px 10px; flex-wrap: wrap; }
.focus-chip {
  display: inline-block; background: var(--accent-soft); color: var(--accent);
  border-radius: 5px; padding: 1px 6px; font-size: 12px; font-weight: 600;
  font-family: var(--font-mono); white-space: nowrap;
}
.receive-chip {
  display: inline-block; border-radius: 5px; padding: 1px 6px; font-size: 12px;
  font-weight: 600; font-family: var(--font-mono); white-space: nowrap;
}
.receive-chip.done { background: var(--good-bg); color: var(--good); }
.receive-chip.partial { background: var(--warn-bg); color: var(--warn); }
button.receive-chip { border: none; cursor: pointer; font-family: inherit; }
/* 입고 칩은 길어질 수 있어 카드 폭 안에서 줄바꿈(단어 단위), 글자 간격도 살짝 좁힘 */
.chip-row { flex-wrap: wrap; min-width: 0; }
.chip-row .receive-chip { white-space: normal; max-width: 100%; box-sizing: border-box; text-align: left; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.4; padding: 3px 8px; font-family: inherit; letter-spacing: -0.02em; font-size: 11.5px; }
.receive-chip.plan { background: var(--warn-bg); color: var(--warn); }
.receive-chip.held { background: #E4EEFC; color: #2563EB; }
.receive-chip.late { background: var(--crit-bg); color: var(--crit); font-weight: 700; }
.receive-chip.unsched { background: var(--surface-2); color: var(--ink-soft); }
.receive-chip.est { outline: 1px dashed currentColor; outline-offset: -1px; }
details.inb-mini { flex: 1 1 100%; min-width: 0; max-width: 100%; }
details.inb-mini > summary { list-style: none; cursor: pointer; display: block; }
details.inb-mini > summary::-webkit-details-marker { display: none; }
details.inb-mini > summary::after { content: ' ▾'; }
details.inb-mini[open] > summary::after { content: ' ▴'; }
.inb-mini-list { margin-top: 6px; padding: 6px 8px; background: var(--surface-2); border-radius: 8px; font-size: 11.5px; }
.inb-mini-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 8px; padding: 3px 0; align-items: baseline; }
.inb-mini-row .c { font-family: var(--font-mono); font-weight: 600; }
.inb-mini-row em { grid-column: 2; font-style: normal; font-size: 10.5px; }
.inb-mini-row.plan em { color: var(--warn); }
.inb-mini-row.held em { color: #2563EB; font-weight: 600; }
.inb-mini-row.late em { color: var(--crit); font-weight: 700; }
.inb-mini-row.late { color: var(--crit); }
.inb-mini-go { margin-top: 6px; border: none; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 2px 0; font-family: inherit; font-size: 11.5px; }
.inb-badge.held { background: #E4EEFC; color: #2563EB; }
.inb-badge.late { background: var(--crit-bg); color: var(--crit); font-weight: 700; }
.inb-grp { padding: 4px 0; border-top: 1px solid var(--line); }
.inb-grp:first-child { border-top: none; }
.inb-grp-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.inb-grp-h b { font-family: var(--font-mono); font-weight: 600; }
.inb-grp-h span { color: var(--ink-soft); }
.inb-grp-h em, .inb-grp-l em { font-style: normal; font-size: 10.5px; }
.inb-grp-s { color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; margin-top: 1px; overflow-wrap: anywhere; }
.inb-grp-l { display: flex; flex-wrap: wrap; gap: 2px 8px; padding: 1px 0 1px 8px; }
.inb-grp.plan em, .inb-grp-l.plan em { color: var(--warn); }
.inb-grp.held em, .inb-grp-l.held em { color: #2563EB; font-weight: 600; }
.inb-grp.late em, .inb-grp.late .inb-grp-h b, .inb-grp-l.late, .inb-grp-l.late em { color: var(--crit); font-weight: 700; }

.table-scroll { display: block; overflow-x: auto; width: 100%; }
table.colors {
  width: 100%; border-collapse: collapse; font-size: 11.5px;
  border-top: 1px solid var(--line); white-space: nowrap; table-layout: fixed;
}
table.colors th {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: 0;
  color: var(--ink-soft); font-weight: 600; text-align: right;
  padding: 6px 3px 4px; background: var(--surface-2); white-space: nowrap;
  overflow: hidden; text-overflow: clip;
}
table.colors td {
  padding: 4px 3px; text-align: right; font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  border-top: 1px solid var(--line); white-space: nowrap;
  overflow: hidden; text-overflow: clip;
}
table.colors td:first-child { font-family: var(--font-body); }
table.colors tr.total td {
  font-weight: 700; background: var(--surface-2);
  border-top: 1px solid var(--ink-soft);
}
.st-pill {
  display: inline-block; padding: 1px 6px; border-radius: 100px; font-weight: 700;
}
.st-good { background: var(--good-bg); color: var(--good); }
.st-warn { background: var(--warn-bg); color: var(--warn); }
.st-crit { background: var(--crit-bg); color: var(--crit); }

.store-wrap { padding: 8px 12px 4px; }
.store-period-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); margin: 4px 0 4px; }
.store-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.store-chip { background: var(--surface-2); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-family: var(--font-mono); white-space: nowrap; }
.store-chip.hl { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.store-chip.hl-y2026 { background: #fbe6bb; color: #8a5a12; font-weight: 600; }
.store-chip.hl-y2027 { background: #cfe0f3; color: #1f4e79; font-weight: 600; }
table.colors tr.color-y2026 td { background: #fdf3e0; }
table.colors tr.color-y2027 td { background: #e8f0f9; }
.hero-line.hero-price { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.4; }
table.colors td:first-child { white-space: normal; overflow: visible; text-overflow: clip; }
.color-kr { font-family: var(--font-body); font-size: 9.5px; color: var(--ink-soft); white-space: normal; }
.season-badge { display: inline-block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--accent); vertical-align: middle; letter-spacing: .02em; }
.map-toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.map-toolbar .toolbar-label { font-size: 12px; color: var(--ink-soft); margin-right: 2px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.sheet-link { text-decoration: none; display: inline-block; white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.sheet-link:hover { border-color: var(--accent); color: var(--accent); }
#mapView.hide-ipj .card .table-scroll { display: none; }
#mapView.hide-store .card .store-wrap { display: none; }
#mapView.hide-spark .card .sparkline-wrap { display: none; }
.sparkline-wrap { padding: 8px 12px 10px; }
.sparkline-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); margin-bottom: 3px; }
.sparkline-svg { width: 100%; height: auto; display: block; }
.sparkline-svg text { font-family: var(--font-mono); }
.spark-qty { font-size: 9.5px; fill: var(--ink-soft); }
.spark-latest-label { font-size: 6.5px; fill: var(--ink-soft); }
.spark-latest-qty { font-size: 11px; font-weight: 700; fill: var(--accent); }

.empty { color: var(--ink-soft); padding: 40px 0; text-align: center; font-size: 15px; }
::-webkit-scrollbar { height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* ---- in-page product/story detail overlay ---- */
.detail-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 1000;
  overflow-y: auto; display: none;
}
.detail-overlay.active { display: block; }
.detail-close {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 14px 32px; background: var(--bg); border: none; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  text-align: left;
}
.detail-close:hover { color: var(--accent); }

.detail-inner { max-width: 1080px; margin: 0 auto; padding: 28px 32px 100px; }

.crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 20px; font-family: var(--font-mono); }
.crumb button { background: none; border: none; color: var(--ink-soft); font-family: var(--font-mono); font-size: 12.5px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.crumb button.current { color: var(--accent); text-decoration: none; cursor: default; font-weight: 600; }
.crumb .sep { opacity: .5; }

.dview { display: none; }
.dview.active { display: block; }

.story-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; max-width: 620px; }
.story-points li { display: flex; gap: 10px; font-size: 14.5px; }
.story-points li::before { content: "✓"; color: var(--accent); font-weight: 700; flex: none; }


.product-layout { display: grid; grid-template-columns: 253px 1fr; gap: 40px; }
.product-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; }
.product-gallery .cell { position: relative; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.product-gallery img { width: 100%; height: 100%; object-fit: contain; display: block; }
.product-gallery .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }

/* 1xN gallery — every color's shots, one image per row, stacked to the left of the copy */
.gallery-col { display: flex; flex-direction: column; }
.gallery-list { display: flex; flex-direction: column; gap: 10px; }
.gallery-list-item { position: relative; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.gallery-list-item img { width: 100%; height: 100%; object-fit: contain; display: block; }
.gallery-list-item .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }

.product-eyebrow { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.product-title { font-family: var(--font-display); font-weight: 600; font-size: 28px; margin: 0 0 14px; text-wrap: balance; }
.product-code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.product-price { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--accent); margin: 14px 0 20px; }

.spec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 20px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.spec-item .s-label { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.spec-item .s-val { font-family: var(--font-mono); font-weight: 600; font-size: 13.5px; margin-top: 2px; }

.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
.tag { font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 100px; }

.section-label { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 0 0 10px; }
.desc-list { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.desc-list li { font-size: 14px; padding-left: 14px; position: relative; }

}


/* ---- 상품 설명집 탭 ---- */
.filters { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flabel { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); width: 54px; }
button.fchip { font-family: var(--font-body); font-size: 13.5px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 11px; color: var(--ink); cursor: pointer; }
button.fchip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); margin-left: 4px; }
button.fchip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
button.fchip.active .n { color: var(--accent); }

button.fchip.group { background: #e8f0f9; border-color: #8fb3d9; color: #1f4e79; font-weight: 600; }
button.fchip.group .n { color: #1f4e79; }
button.fchip.group.active { background: #1f4e79; border-color: #1f4e79; color: #fff; }

.story-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; margin-bottom: 18px; }
.story-box.flash { outline: 3px solid var(--accent); outline-offset: 2px; }
.story-box { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 10px 28px; }
.sb-eyebrow { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.sb-title { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.25; color: var(--accent); background: none; border: none; padding: 0; text-align: left; text-transform: uppercase; text-wrap: balance; }
.sb-count { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.sb-desc { margin-top: 10px; }
.sb-desc .story-points li, .sb-desc .story-plain { font-size: 14.5px; }
.story-plain { color: var(--ink-soft); }
.season-break { grid-column: 1 / -1; height: 0; }
.sb-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 760px) { .story-box { grid-template-columns: 1fr; } }
.simple-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
.simple-card:hover { border-color: var(--accent); }
.simple-thumb { aspect-ratio: 1; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.simple-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.simple-thumb .noimg { width: 100%; height: 100%; }
.simple-body { padding: 10px 12px 12px; }
.simple-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.simple-name-kr { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
.simple-size { font-size: 11.5px; color: var(--ink-soft); }
.simple-price { font-size: 14px; font-weight: 700; margin: 2px 0 8px; }
.swatch-row { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; background: var(--surface-2); border-radius: 6px; padding: 2px 7px 2px 5px; }
.swatch-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--line); }
.cg-line { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.cg-label { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: .02em; }
.cg-old-box { margin-top: 6px; }
.cg-old-box > summary { cursor: pointer; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); list-style: none; }
.cg-old-box > summary::-webkit-details-marker { display: none; }
.cg-old-box > summary::after { content: ' ▾'; }
.cg-old-box[open] > summary::after { content: ' ▴'; }
.cg-old-box .swatch-row { margin-top: 4px; }
.cg-tag { display: inline-block; font-size: 9px; font-weight: 700; line-height: 1.5; padding: 0 4px; margin-right: 5px; border-radius: 3px; vertical-align: 1px; letter-spacing: -0.01em; }
.cg-tag.cg-core { background: var(--ink); color: var(--surface); }
.cg-tag.cg-new { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.cg-tag.cg-old { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }



/* ---- page-level tabs (주간 판매 / MAP / 상품 설명집) ---- */
.top-sticky { position: sticky; top: 0; z-index: 30; margin: 0 -32px 18px; padding: 10px 32px 0; background: var(--bg); }

/* ---- 입고현황 탭 ---- */
.inb-search-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 16px; max-width: 1140px; }
.inb-search-row input {
  font-family: var(--font-body); font-size: 14px; padding: 7px 12px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--surface); color: var(--ink); width: 240px;
}
.inb-count { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
.inb-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 1140px; }
.inb-row.inb-summary { background: var(--surface-2); border-bottom: 2px solid var(--line-strong); }
.inb-sticky-summary {
  position: sticky; top: var(--top-h, 0px); z-index: 6; max-width: 1140px; border: 1px solid var(--line-strong);
  border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.inb-row.inb-summary .inb-name { font-family: var(--font-mono); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; font-size: 12.5px; color: var(--ink-soft); }
.inb-row.inb-summary .inb-badge b { font-family: var(--font-mono); margin-left: 3px; }
.inb-row {
  display: grid; grid-template-columns: 44px minmax(220px, 1.3fr) minmax(220px, 2fr) 190px 90px; gap: 16px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.inb-row:last-child { border-bottom: none; }
.inb-row.done { background: var(--good-bg); }
.inb-thumb { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; background: var(--surface-2); flex-shrink: 0; }
.inb-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.inb-name { font-size: 15px; font-weight: 500; min-width: 0; overflow-wrap: break-word; line-height: 1.35; }
.inb-color-tag {
  display: inline-block; background: var(--surface-2); color: var(--ink); font-family: var(--font-mono);
  font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 5px; margin-left: 8px; letter-spacing: .02em;
}
#inbMatFilter, #inbChaFilter, #inbOcFilter { margin-top: 14px; row-gap: 10px; }
.inb-code { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.inb-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.inb-badge {
  display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600;
  padding: 4px 12px; border-radius: 100px; white-space: nowrap;
}
.inb-badge.completed { background: var(--good-bg); color: var(--good); }
.inb-badge.pending { background: var(--accent-soft); color: var(--accent); }
.inb-badge.unsched { background: var(--surface-2); color: var(--ink-soft); }
.inb-badge.ocpending { background: #E4EEFC; color: #2563EB; }
.inb-badge.cancelled { background: var(--surface-2); color: var(--ink-soft); }
.inb-row.done .inb-badge.completed { background: var(--surface); }
.inb-bar-col { display: flex; flex-direction: column; gap: 5px; }
.inb-bar-track { display: flex; height: 15px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.inb-bar-received { background: var(--good); }
.inb-bar-seg { background: var(--accent); }
.inb-bar-unsched {
  background: repeating-linear-gradient(45deg, var(--line-strong), var(--line-strong) 3px, transparent 3px, transparent 6px);
}
.inb-bar-caption { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); display: flex; gap: 9px; }
.inb-bar-caption b { color: var(--ink); font-weight: 700; }
.inb-rate { font-family: var(--font-mono); font-size: 16px; font-weight: 700; text-align: right; }
.inb-rate .done-tag { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--good); margin-top: 2px; white-space: nowrap; }
.inb-empty { padding: 30px; text-align: center; color: var(--ink-soft); }

/* ---- weekly sales dashboard ---- */
table.dash th.ch-p, table.dash th.cl { cursor: pointer; text-align: center; }
table.dash th.cl, table.dash td.cl { min-width: 34px; width: 34px; color: var(--ink-soft); border-left: 1px dashed var(--line); text-align: center; }
table.dash td.cl { cursor: default; }
.print-ctl { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.print-ctl label { margin-right: 0; }
.dash-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
#chPeriodCtl { display: inline-flex; gap: 6px; align-items: center; }
#chPeriodCtl label { margin-right: 0; }
#chPeriodCtl .ch-note { font-size: 11.5px; color: var(--ink-soft); margin-left: 6px; }
.dash-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 4px; }
.dash-ref-legend { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); margin: 0 0 16px 2px; }
.dash-filters label { font-size: 12.5px; color: var(--ink-soft); font-family: var(--font-mono); margin-right: 4px; }
.dash-filters input[type="date"], .dash-filters select, .dash-filters .dash-btn {
  font-family: var(--font-mono); font-size: 12.5px; padding: 5px 10px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
  cursor: pointer;
}
/* 헤더행(틀고정)·첫 열(품명 틀고정)을 모두 유지하려면 가로/세로 스크롤이 같은 컨테이너 안에 있어야 한다 (CSS 제약 — overflow-x가
   visible이 아니면 overflow-y도 사실상 스크롤 컨테이너가 되어 sticky가 더는 페이지 스크롤을 따라가지 못한다).
   그래서 페이지 전체를 길게 늘이는 대신 표 자체 높이를 넉넉하게 잡고 그 안에서 세로 스크롤하도록 되돌린다. */
.dash-scroll { overflow: auto; max-height: 82vh; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; }
.hidden-chips { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hidden-chip {
  font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 100px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
}
.hidden-chip:hover { background: var(--accent-soft); color: var(--accent); }
table.dash {
  border-collapse: separate; border-spacing: 0; font-size: 10.5px; white-space: nowrap;
  font-family: var(--font-mono); width: 100%;
}
table.dash th, table.dash td {
  padding: 4px 4px; text-align: center; border-bottom: 0.5px solid var(--line-strong);
  border-right: 0.5px solid var(--line-strong);
}
table.dash thead th {
  position: sticky; top: 0; z-index: 3; background: var(--surface-2);
  font-weight: 700; font-size: 11px; text-transform: uppercase; text-align: center;
}
table.dash thead tr.grp th { top: 0; z-index: 4; }
table.dash thead tr.sub th { top: 27px; z-index: 3; font-size: 10.5px; color: var(--ink-soft); font-weight: 600; }
table.dash .id-col { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; }
table.dash thead .id-col { z-index: 5; background: var(--surface-2); text-align: left; }
table.dash .id-name { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; white-space: nowrap; }
table.dash thead .id-name { z-index: 5; background: var(--surface-2); }
table.dash .grp-band-0 { background: #eef2ee; }
table.dash .grp-band-1 { background: #f2ede6; }
table.dash th.grp-start, table.dash td.grp-start { border-left: 2px solid var(--ink-soft); }
table.dash tr.row-cat td { font-weight: 700; font-size: 13px; cursor: pointer; }
table.dash tr.row-grp td { font-weight: 600; cursor: pointer; }
table.dash tr.row-sub td { background: #f6f3ee; font-weight: 600; cursor: pointer; }
table.dash tr.row-sub .id-name { background: #f6f3ee; }
table.dash tr.row-item .id-name { padding-left: 34px; }
table.dash tr.row-item:hover td { background: var(--accent-soft); }
table.dash tr.row-item:hover .id-name { background: var(--accent-soft); }
.dash-toggle { display: inline-block; width: 14px; color: var(--accent); }
.dash-lvl1 .id-name { padding-left: 10px; }
.dash-lvl2 .id-name { padding-left: 18px; }
.yoy-up { color: var(--yoy-up); }
.yoy-down { color: var(--yoy-down); }
.yoy-zero { color: #4f473d; font-weight: 600; }
.cell-yoy { font-size: 9px; margin-left: 3px; font-weight: 700; }
table.dash .id-col.st-col, table.dash .id-col.sku-col, table.dash td.st-col, table.dash td.sku-col { min-width: 60px; }
.dash-note { display: block; font-size: 9.5px; color: var(--ink-soft); font-style: italic; margin-top: 1px; white-space: normal; }
.name-last { display: block; font-size: 9.5px; color: #4f473d; margin-top: 1px; white-space: normal; }
.stack-wrap { display: inline-block; text-align: left; }
.stack-this { line-height: 1.3; }
.stack-last { font-size: 9.5px; color: #4f473d; line-height: 1.3; }
table.dash tr.row-lastonly td { background: #efe9e0; color: var(--ink-soft); font-style: italic; }
table.dash tr.row-lastonly .id-name { background: #efe9e0; }
table.dash tr.row-sub-pinned td { background: #fbf0d9; }
table.dash tr.row-sub-pinned .id-name { background: #fbf0d9; font-weight: 700; }
table.dash tr.row-item-highlight td { background: #fbf0d9; }
table.dash tr.row-item-highlight .id-name { background: #fbf0d9; font-weight: 600; }
table.dash tr.row-cat td, table.dash tr.row-cat .id-name { background: #e2b48f; }
table.dash tr.row-grp td, table.dash tr.row-grp .id-name { background: #f2e0cd; }
table.dash tr.row-story-teddy td, table.dash tr.row-story-teddy .id-name { background: #f6dcd2; }
table.dash tr.row-story-polished td, table.dash tr.row-story-polished .id-name { background: #e3ddf3; }
table.dash tr.row-story-brushed td, table.dash tr.row-story-brushed .id-name { background: #dcece2; }
.story-tag { margin-left: 10px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.row-story-teddy .story-tag { color: #712b13; }
.row-story-polished .story-tag { color: #3c3489; }
.row-story-brushed .story-tag { color: #085041; }

/* 매장 배포 사이트: 블랙&화이트 */
:root { --bg: #fff; --surface: #fff; --surface-2: #f4f4f4; --ink: #111; --ink-soft: #666; --line: #e2e2e2; --line-strong: #8a8a8a;
  --accent: #111; --accent-soft: #f0f0f0; --good: #111; --good-bg: #f0f0f0; --warn: #111; --warn-bg: #f0f0f0; --crit: #111; --crit-bg: #eee; }

button.fchip.group { background: #f0f0f0; border-color: #8a8a8a; color: #111; }
button.fchip.group .n { color: #111; }
button.fchip.group.active { background: #111; border-color: #111; color: #fff; }
button.fchip.group.active .n { color: #fff; }
header.cat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
header.cat-head h1 { margin: 0; }
header.cat-head .map-search { flex: 0 1 380px; min-width: 220px; }
header.cat-head .map-search input { width: 100%; }
/* 태블릿 이상: 스토리명(좌) + 스토리 설명(우) 한 줄, 아이템 카드는 그 아래 전체 폭 */
@media (min-width: 700px) {
  .story-box { grid-template-columns: minmax(0, 1fr); }
  .sb-head { display: grid; grid-template-columns: minmax(220px, 360px) minmax(0, 1fr); column-gap: 32px; align-items: start; }
  .sb-head > .sb-eyebrow, .sb-head > .sb-title, .sb-head > .sb-count { grid-column: 1; }
  .sb-head > .sb-desc { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; }
}

html, body { -webkit-text-size-adjust: 100%; }
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
.wrap { padding: 18px 20px 40px; }
.cat-top { margin: 0 -20px 10px; padding: 10px 20px; }
nav.materials { margin: 12px 0 8px; overflow-x: auto; white-space: nowrap; }
.detail-close { padding: 14px 20px; }
.detail-inner { padding: 20px 20px 80px; }
@media (min-width: 700px) { .wrap { padding: 24px 28px 48px; } .cat-top { margin: 0 -28px 10px; padding: 10px 28px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="page cat-head"><h1>상품 설명집</h1><div class="map-search"><input type="search" id="catSearch" placeholder="전체 검색: 품명(영문·한글)/품번" autocomplete="off"><span class="map-search-count" id="catSearchCount"></span></div></header>
  <div class="page-view active" id="catalogView">
    <nav class="materials" id="catMaterialTabs"></nav>
    <div class="filters">
      <div class="cat-top"><div class="fchips" id="catPlanRow"></div></div>
      <div class="filters-rest" id="catFilters"></div>
    </div>
    <div id="catStories"></div>
  </div>
</div>
<div class="detail-overlay" id="detail-overlay">
  <button class="detail-close" onclick="closeDetail()">← 상품 설명집으로 돌아가기</button>
  <div class="detail-inner">
    <div class="crumb" id="crumb"></div>
    <section class="dview" id="dview-product"></section>
  </div>
</div>

function fmtNum(n) { return (n || 0).toLocaleString('ko-KR'); }
function rrpDisplay(s) {
  if (s.price_increase && s.price_increase.from && s.price_increase.to) {
    return `₩${fmtNum(parseInt(s.price_increase.from))} <span class="price-up-arrow">→ ₩${fmtNum(parseInt(s.price_increase.to))}</span> <span class="price-up-badge">인상예정</span>`;
  }
  return `₩${fmtNum(parseInt(s.rrp || 0))}`;
}

  const sr = (s.seasons && s.seasons.length && !s.seasons.includes('R27')) ? 1 : 0;
  const pr = STYLE_PLAN_RANK[s.plan] !== undefined ? STYLE_PLAN_RANK[s.plan] : 3;
  return [sr, pr, pr === 0 ? styleBodyRank(s.body || '') : 0, -qty];
}
const cmpOrderKey = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2] || a[3] - b[3];
function sortStyleCodes(codes) {
  if (codes.some(c => STYLES[c] && STYLES[c].material === 'ICONIC')) return codes;
  const key = c => styleOrderKey(STYLES[c] || {}, (STYLES[c] && STYLES[c].total && STYLES[c].total.order) || 0);
  return codes.slice().sort((x, y) => cmpOrderKey(key(x), key(y)));
}

// ---------------- detail overlay ----------------

function openDetailProduct(itemCode) {
  detailState.product = itemCode;
  document.getElementById('detail-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderDetailProduct(itemCode);
  document.getElementById('detail-overlay').scrollTo(0, 0);
}
function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('active');
  document.body.style.overflow = '';
}
function renderCrumb(storyName, productName) {
  const el = document.getElementById('crumb');
  if (productName) {
    el.innerHTML = `<span>${storyName}</span><span class="sep">/</span><button class="current">${productName}</button>`;
  } else {
    el.innerHTML = `<button class="current">${storyName}</button>`;
  }
}

function productThumb(s) {
  const first = s.colors.find(c => c.image);
  return first ? first.image : null;
}

// ICONIC 컬러 그룹(코어 / NEW 시즌 / 구 시즌): 모든 컬러에 cgroup이 있을 때만 그룹으로 나눈다. 구 시즌은 기본 접힘.
function cgGroups(colors) {
  if (!colors.length || !colors.every(c => c.cgroup)) return null;
  return ['코어', 'NEW 시즌', '구 시즌'].map(l => ({ label: l, colors: colors.filter(c => c.cgroup === l) })).filter(g => g.colors.length);
}
// 컬러코드 앞에 붙이는 작은 딱지: 코어 / NEW / 구시즌
function cgTagHtml(g) {
  const k = g === '코어' ? 'core' : g === 'NEW 시즌' ? 'new' : 'old';
  return `<span class="cg-tag cg-${k}">${g === 'NEW 시즌' ? 'NEW' : g === '구 시즌' ? '구시즌' : g}</span>`;
}

function renderDetailProduct(itemCode) {
  document.getElementById('dview-product').classList.add('active');
  const s = STYLES[itemCode];
  if (!s) return;
  renderCrumb(s.story, s.name_sjg);

  const galleryHtml = s.has_hq_gallery
    ? `<div class="gallery-list">${s.colors.filter(c => c.gallery).flatMap(c => c.gallery.map(img => `
        <div class="gallery-list-item">
          <img src="${img}" alt="${s.name_sjg} ${c.color_code}">
          <span class="tag">${c.color_code}</span>
        </div>`)).join('')}</div>`
    : (s.colors.filter(c => c.image).map(c => `
        <div class="cell"><img src="${c.image}" alt="${s.name_sjg} ${c.color_code}"><span class="tag">${c.color_code}</span></div>`).join('')
        || `<div class="cell"></div>`);

  const specs = [
    ['복종', s.body], ['챙길이', s.brim], ['사이즈', s.sizes.join('/')],
    ['원산지', s.origin], ['더스트백', s.dustbag], ['출고일', mmdd(s.ship_date)],
  ].filter(([, v]) => v);
  const specsHtml = specs.map(([label, val]) => `
    <div class="spec-item"><div class="s-label">${label}</div><div class="s-val">${val}</div></div>`).join('');

  const tagsHtml = (s.tags && s.tags.length)
    ? `<div class="tag-row">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';

  const descHtml = (s.desc && s.desc.length)
    ? `<div class="section-label">제품 설명</div><ul class="desc-list">${s.desc.map(d => `<li>${d}</li>`).join('')}</ul>` : '';

  const colorRowOf = c => `<tr><td>${c.cgroup ? cgTagHtml(c.cgroup) : ''}${c.color_code}</td><td>${c.color_kr || ''}</td><td>${fmtNum(c.order)}</td></tr>`;
  const colorRows = s.colors.map(colorRowOf).join('');
  const totalRow = s.colors.length > 1 ? `<tr class="total"><td>TOTAL</td><td></td><td>${fmtNum(s.total.order)}</td></tr>` : '';

  const materialHtml = (s.material_full || s.material_main)
    ? `<div class="section-label">혼용율</div><div class="material-box"><div class="m-label">Composition</div>${s.material_full || s.material_main}</div>` : '';

  const careHtml = (s.care && s.care.length)
    ? `<div class="section-label">제품 케어 방법</div><div class="care-box"><p>${s.care.join(' / ')}</p></div>` : '';

  const infoHtml = `
      <div>
        <div class="product-eyebrow">${s.story}</div>
        <h1 class="product-title">${s.name_sjg} <span class="name-kr-inline">${s.name_kr}</span></h1>
        ${s.transition_note ? `<div class="transition-note">${s.transition_note}</div>` : ''}
        <div class="product-code">품번 ${s.material === 'ICONIC' ? (s.display_code || '') : s.item_code}</div>
        <div class="product-price">${rrpDisplay(s)}</div>
        <div class="spec-grid">${specsHtml}</div>
        ${tagsHtml}
        ${descHtml}
        <div class="section-label">컬러 · 수량</div>
        <table class="color-table"><thead><tr><th>컬러</th><th>컬러명</th><th>발주수량</th></tr></thead><tbody>${colorRows}${totalRow}</tbody></table>
        ${materialHtml}
        ${careHtml}
      </div>`;

  document.getElementById('dview-product').innerHTML =
    `<div class="product-layout"><div class="${s.has_hq_gallery ? 'gallery-col' : 'product-gallery'}">${galleryHtml}</div>${infoHtml}</div>`;
}


// 상품 설명집 탭: 시즌 탭 > 기획명/복종 필터 > 스토리 박스(소개 문구 + 아이템 카드, 출고 순).
// generate_html.py가 바잉 마스터파일 스크립트에 끼워 넣는다(TREE/STYLES/STORIES와 fmtNum·rrpDisplay·mmdd·korMmdd 등 공용 함수를 사용).
(function () {
  const state = { material: null, plan: 'ALL', body: 'ALL', attr: 'ALL', search: '' };
  let ready = false;
  const attr = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;');

  // ---------------- 기획명 / 복종 / 소재 필터 ----------------
  const BODY_GROUP = { '바이저중간챙': '바이저', '바이저큰챙': '바이저', '클로슈작은챙': '클로슈', '클로슈중간챙': '클로슈', '클로슈큰챙': '클로슈',
    '버킷큰챙': '버킷', '페도라작은챙': '페도라', '페도라중간챙': '페도라' };
  const FILTER_ORDER = { '모자': ['바이저', '클로슈', '버킷', '카스켓', '보터햇', '캡', '페도라', '헌팅캡', '베레', '비니'],
    '가방': ['숄더백', '토트백', '크로스바디', '클러치'], '액세서리': ['스카프', '글로브', '액세서리'] };
  const PLANS = ['모자', '가방', '액세서리'];
  // 소재 필터 라벨(입판재 "속성명" 원본 -> 한글 표기) — MAP과 동일한 매핑
  const ATTR_LABEL = {
    'BRAID (CLASSIC)': '브레이드', 'BRAID (LACE)': '브레이드', 'BRAID (LIGHT)': '라이트 브레이드',
    'BRAID (SCALLOP)': '스캘롭 브레이드', 'BRAID (WIDE)': '와이드 브레이드', 'CROCHET': '크로셰', 'ETC': '기타',
    'FABRIC (BOUCLE)': '부클', 'FABRIC (CORDUROY)': '코듀로이', 'FABRIC (COTTON)': '코튼', 'FABRIC (ETC)': '기타',
    'FABRIC (KNIT)': '니트', 'FABRIC (LINEN)': '린넨', 'FABRIC (NYLON)': '나일론', 'FABRIC (WOOL)': '울',
    'FINE WOOL FELT': '울펠트', 'FUR': '퍼', 'LEATHER': '레더', 'PANAMA': '파나마', 'WOOL FELT': '울펠트',
    'CROCHET&FABRIC': '크로셰&패브릭',
  };
  const bodyGroup = s => BODY_GROUP[s.body] || s.body;
  const attrLabel = s => ATTR_LABEL[s.attr] || s.attr || '';
  // 기준 = 혼용률(material_main/material_full)에 '라피아', 또는 품명에 RAFFIA/PANAMA(파나마 햇 포함)가 들어가면 라피아, 그 외 전부 CMT (혼용률 비어 있어도 품명으로 판정)
  const SS27_GROUPS = ['라피아', 'CMT'];
  const ssGroupOf = s => (/라피아/.test((s.material_full || '') + ' ' + (s.material_main || '') + ' ' + (s.name_kr || '')) || /RAFFIA|PANAMA/i.test(s.name_sjg || '') || s.attr === 'PANAMA') ? '라피아' : 'CMT';
  const attrOk = s => state.attr === 'ALL' || (SS27_GROUPS.includes(state.attr) ? (s.season_tab === 'SS27' && ssGroupOf(s) === state.attr) : attrLabel(s) === state.attr);
  const norm = t => String(t || '').toLowerCase().replace(/\s+/g, '');
  const searchOk = s => {
    const q = norm(state.search);
    return !q || norm([s.name_sjg, s.name_kr, s.aw26_item_code, s.ss27_item_code].join(' ')).includes(q);
  };
  // 검색어가 있으면(사이트에서 window.CATALOG_GLOBAL_SEARCH 켠 경우) 탭·필터와 상관없이 전체 시즌/기획을 대상으로 검색
  const globalSearch = () => !!window.CATALOG_GLOBAL_SEARCH && !!state.search.trim();
  const matches = s => globalSearch() ? searchOk(s) : (state.plan === 'ALL' || s.plan === state.plan) && (state.body === 'ALL' || bodyGroup(s) === state.body)
    && attrOk(s) && searchOk(s);

  function eachStyle(material, fn) {
    Object.values(TREE[material] || {}).forEach(weeks => Object.values(weeks).forEach(w => w.stories.forEach(g => g.styles.forEach(c => { if (STYLES[c]) fn(STYLES[c]); }))));
  }
  function filterMonth(monthData) {
    const out = {};
    Object.entries(monthData || {}).forEach(([wk, w]) => {
      const list = w.stories.map(g => ({ ...g, styles: g.styles.filter(c => STYLES[c] && matches(STYLES[c])) })).filter(g => g.styles.length);
      if (list.length) out[wk] = { thursday: w.thursday, stories: list };
    });
    return out;
  }

  function renderFilters() {
    const pc = {}, bc = {};
    eachStyle(state.material, s => {
      pc[s.plan] = (pc[s.plan] || 0) + 1;
      if (state.plan === 'ALL' || s.plan === state.plan) bc[bodyGroup(s)] = (bc[bodyGroup(s)] || 0) + 1;
    });
    const total = Object.values(pc).reduce((a, b) => a + b, 0);
    const chip = (kind, val, label, n, on) => `<button class="fchip${on ? ' active' : ''}${n ? '' : ' zero'}" data-k="${kind}" data-v="${attr(val)}">${label}<span class="n">${n}</span></button>`;
    const planRow = `<span class="flabel">기획명</span>${chip('plan', 'ALL', '전체', total, state.plan === 'ALL')}${PLANS.map(p => chip('plan', p, p, pc[p] || 0, state.plan === p)).join('')}`;
    let html = '';
    if (state.plan !== 'ALL') {
      const known = FILTER_ORDER[state.plan] || [];
      const list = known.concat(Object.keys(bc).filter(g => !known.includes(g)));
      html += `<div class="fchips"><span class="flabel">복종</span>${chip('body', 'ALL', '전체', pc[state.plan] || 0, state.body === 'ALL')}${list.map(g => chip('body', g, g, bc[g] || 0, state.body === g)).join('')}</div>`;
    }
    const ac = {}, gc = {};
    eachStyle(state.material, s => {
      if (!((state.plan === 'ALL' || s.plan === state.plan) && (state.body === 'ALL' || bodyGroup(s) === state.body))) return;
      const label = attrLabel(s);
      if (label) ac[label] = (ac[label] || 0) + 1;
      gc[ssGroupOf(s)] = (gc[ssGroupOf(s)] || 0) + 1;
    });
    const attrLabels = Object.keys(ac).sort((a, b) => ac[b] - ac[a]);
    const attrTotal = Object.values(ac).reduce((a, b) => a + b, 0);
    if (attrLabels.length) {
      const groupChips = state.material === 'COLLECTION_SS27' ? SS27_GROUPS.map(g => `<button class="fchip group${state.attr === g ? ' active' : ''}${gc[g] ? '' : ' zero'}" data-k="attr" data-v="${g}">${g}<span class="n">${gc[g] || 0}</span></button>`).join('') : '';
      html += `<div class="fchips"><span class="flabel">소재</span>${chip('attr', 'ALL', '전체', attrTotal, state.attr === 'ALL')}${groupChips}${attrLabels.map(l => chip('attr', l, l, ac[l], state.attr === l)).join('')}</div>`;
    }
    document.getElementById('catPlanRow').innerHTML = planRow;  // 검색창은 이 행의 오른쪽에 고정 배치(입력 중 다시 그려지지 않도록 별도 요소)
    document.getElementById('catFilters').innerHTML = html;
    document.querySelectorAll('#catPlanRow button, #catFilters button').forEach(b => b.onclick = () => {
      if (b.dataset.k === 'plan') { state.plan = b.dataset.v; state.body = 'ALL'; state.attr = 'ALL'; }
      else if (b.dataset.k === 'body') { state.body = b.dataset.v; state.attr = 'ALL'; }
      else { state.attr = b.dataset.v; }
      renderAll();
    });
  }

  // ---------------- 카드: 영문명/한글명/이미지/사이즈/가격/컬러(스와치+한글컬러명)만 남김 ----------------
  function renderCard(s) {
    const hero = s.colors.find(c => c.image);
    const chipOf = c => `
      <span class="swatch-chip">${c.swatch ? `<span class="swatch-dot" style="background:${c.swatch}"></span>` : ''}${c.color_code}${c.color_kr ? ' · ' + c.color_kr : ''}</span>`;
    const cgs = cgGroups(s.colors);   // ICONIC: 코어 / NEW 시즌 / 구 시즌(기본 접힘)
    const chips = cgs ? cgs.map(g => g.label === '구 시즌'
      ? `<details class="cg-old-box" onclick="event.stopPropagation()"><summary>${g.label} ${g.colors.length}</summary><div class="swatch-row">${g.colors.map(chipOf).join('')}</div></details>`
      : `<div class="cg-line"><span class="cg-label">${g.label}</span><div class="swatch-row">${g.colors.map(chipOf).join('')}</div></div>`).join('')
      : `<div class="swatch-row">${s.colors.map(chipOf).join('')}</div>`;
    return `
    <div class="simple-card" onclick="openDetailProduct('${s.item_code}')">
      <div class="simple-thumb">${hero ? `<img src="${hero.image}" alt="${attr(s.name_sjg)}">` : '<div class="noimg"></div>'}</div>
      <div class="simple-body">
        <div class="simple-name">${s.name_sjg}${s.seasons && s.seasons.includes('R27') ? ' <span class="season-badge">R27</span>' : ''}</div>
        <div class="simple-name-kr">${s.name_kr}</div>
        <div class="simple-size">사이즈 ${s.sizes.join('/')}</div>
        <div class="simple-price">${rrpDisplay(s)}</div>
        ${chips}
      </div>
    </div>`;
  }

  // ---------------- 스토리 박스 ----------------
  const SEASON_LABEL = { AW26: 'AW26', SS27: 'SS27' };
  function seasonLabel(s) {
    if (s.season_tab === 'SS27' && s.item_code.startsWith('HYR')) return 'R27 COLLECTION';
    return SEASON_LABEL[s.season_tab] || 'COLLECTION';
  }
  function storyBox(g) {
    const cards = g.styles.map(c => STYLES[c]);
    const first = cards[0];
    const isIconic = first.material === 'ICONIC';
    const info = STORIES[g.story];
    const tags = [...new Set(cards.flatMap(c => c.seasons || []))];
    const eyebrow = info && info.eyebrow ? info.eyebrow : (isIconic ? 'ICONIC · ' + g.category : (tags.length > 1 ? tags.join(' · ') + ' COLLECTION' : seasonLabel(first)));
    const points = info && info.bullets && info.bullets.length
      ? `<ul class="story-points">${info.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`
      : (isIconic ? '<div class="story-plain">시즌에 관계없이 상시 판매되는 아이코닉 상품입니다.</div>' : '');
    return `
    <div class="story-box" data-box="${attr(g.story)}">
      <div class="sb-head">
        <div class="sb-eyebrow">${eyebrow}</div>
        <div class="sb-title">${g.story}</div>
        <div class="sb-count">스타일 ${cards.length}종</div>
        ${points ? `<div class="sb-desc">${points}</div>` : ''}
      </div>
      <div class="sb-cards">${cards.map(c => renderCard(c)).join('')}</div>
    </div>`;
  }

  // ---------------- 나열 / 탭 ----------------
  function seasonMonthRank(mo) { const n = parseInt(mo, 10); return n === 12 ? -1 : n; }
  function monthKeys(material) {
    const obj = TREE[material] || {};
    if (material === 'ICONIC') return Object.keys(obj);
    return Object.keys(obj).sort((a, b) => material === 'COLLECTION_SS27' ? seasonMonthRank(a) - seasonMonthRank(b) : a - b);
  }
  // 출고월/주차 구분 없이 전부 나열하되 순서는 출고 순(월 > 주차). 컬렉션은 같은 스토리를 박스 하나로 합치고, 아이코닉은 기획명별로 나눈다.
  function collectStories() {
    const order = ['COLLECTION', 'COLLECTION_SS27', 'ICONIC'];
    const mats = globalSearch() ? Object.keys(TREE).sort((a, b) => order.indexOf(a) - order.indexOf(b)) : [state.material];
    return mats.flatMap(collectStoriesOf);
  }
  function collectStoriesOf(material) {
    const obj = TREE[material] || {};
    const isIconic = material === 'ICONIC';
    const boxes = [], byStory = {};
    monthKeys(material).forEach(mo => {
      const data = filterMonth(obj[mo]);
      const weekKeys = Object.keys(data);
      if (!isIconic) weekKeys.sort((a, b) => a - b);
      weekKeys.forEach(wk => data[wk].stories.forEach(g => {
        if (!isIconic && byStory[g.story]) { byStory[g.story].styles = byStory[g.story].styles.concat(g.styles); return; }
        const box = { story: g.story, styles: g.styles.slice(), category: mo };
        boxes.push(box);
        if (!isIconic) byStory[g.story] = box;
      }));
    });
    boxes.forEach(b => { b.styles = sortStyleCodes(b.styles); });  // 스토리 안 기본 정렬(모자 > 가방 > 액세서리 > 그 외, 클로슈 > 버킷 > 보터, 발주 많은 순)
    return boxes;
  }
  function renderStories() {
    const boxes = collectStories();
    document.getElementById('catStories').innerHTML = boxes.length ? boxes.map(storyBox).join('') : '<div class="empty">해당 조건의 상품이 없습니다.</div>';
  }

  const MATERIAL_LABELS = { COLLECTION: 'AW26', COLLECTION_SS27: 'SS27', ICONIC: 'ICONIC' };
  function renderMaterialTabs() {
    const order = ['COLLECTION', 'COLLECTION_SS27', 'ICONIC'];
    const materials = Object.keys(TREE).sort((a, b) => order.indexOf(a) - order.indexOf(b));
    if (!state.material) state.material = materials[0];
    const el = document.getElementById('catMaterialTabs');
    el.innerHTML = materials.map(m => {
      let n = 0;
      eachStyle(m, s => { if (matches(s)) n++; });
      return `<button data-mat="${m}" class="${m === state.material && !globalSearch() ? 'active' : ''}">${MATERIAL_LABELS[m] || m}<span class="count">${n}종</span></button>`;
    }).join('');
    el.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (globalSearch()) { state.search = ''; document.getElementById('catSearch').value = ''; }
      state.material = b.dataset.mat; state.plan = 'ALL'; state.body = 'ALL'; state.attr = 'ALL'; renderAll();
    });
  }

  function renderAll() {
    ready = true; renderMaterialTabs(); renderFilters(); renderStories();
    const fl = document.querySelector('.filters'); if (fl && window.CATALOG_GLOBAL_SEARCH) fl.hidden = globalSearch();
    const cnt = document.getElementById('catSearchCount');
    if (cnt) cnt.textContent = state.search.trim() ? `${collectStories().reduce((a, b) => a + b.styles.length, 0)}종` : '';
  }
  document.getElementById('catSearch').oninput = e => { state.search = e.target.value; renderAll(); };

  // ---------------- 바깥에서 호출 ----------------
  function materialOfStyle(s) { return s.material === 'ICONIC' ? 'ICONIC' : (s.season_tab === 'SS27' ? 'COLLECTION_SS27' : 'COLLECTION'); }
  function materialOfStory(name) {
    return Object.keys(TREE).find(m => Object.values(TREE[m]).some(weeks => Object.values(weeks).some(w => w.stories.some(g => g.story === name))));
  }
  window.catalogShow = () => { if (!ready) renderAll(); };
  // MAP에서 스토리/상품을 눌렀을 때: 설명집 탭이 보이는 상태에서 호출 — 스토리는 해당 박스로 스크롤, 상품은 상세 화면 열기
  window.catalogLand = (kind, value) => {
    if (kind === 'product' && STYLES[value]) {
      state.material = materialOfStyle(STYLES[value]); state.plan = 'ALL'; state.body = 'ALL'; state.attr = 'ALL';
      renderAll();
      openDetailProduct(value);
    } else if (kind === 'story') {
      const m = materialOfStory(value);
      if (!m) { window.catalogShow(); return; }
      state.material = m; state.plan = 'ALL'; state.body = 'ALL'; state.attr = 'ALL';
      renderAll();
      const box = [...document.querySelectorAll('#catStories .story-box')].find(b => b.dataset.box === value);
      if (box) { box.scrollIntoView({ block: 'start' }); box.classList.add('flash'); setTimeout(() => box.classList.remove('flash'), 2200); }
    }
  };
})();

window.catalogShow();
</script>
<script src="fs.js"></script>
</body>
</html>
