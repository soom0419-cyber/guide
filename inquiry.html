<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>문의</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light; --bg: #fff; --ink: #111; --muted: #6b6b6b; --line: #e2e2e2; --accent: #111; --card: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 'IBM Plex Sans KR', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 20px 48px; }
h1 { font: 600 28px/1.2 Fraunces, 'IBM Plex Sans KR', serif; margin: 4px 0 6px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.who { display: inline-block; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; margin-bottom: 18px; }
label.f, .f-label { display: block; font-weight: 600; font-size: 14px; margin: 18px 0 6px; }
.opt { font-weight: 400; color: var(--muted); }
.types { display: flex; flex-wrap: wrap; gap: 8px; }
.types input { position: absolute; opacity: 0; pointer-events: none; }
.types span { display: inline-block; padding: 10px 16px; min-height: 44px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; font-size: 15px; }
.types input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.types input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], textarea { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
textarea { min-height: 150px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.add { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.th { position: relative; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th button { position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 16px; line-height: 26px; padding: 0; cursor: pointer; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.send { width: 100%; margin-top: 26px; min-height: 52px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 700 17px 'IBM Plex Sans KR', sans-serif; cursor: pointer; }
.send:disabled { opacity: .55; cursor: default; }
.msg { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14.5px; }
.msg.ok { background: #f0f0f0; color: #111; }
.msg.err { background: #fff; color: #111; border: 1px solid #111; }
</style>
</head>
<body>
<div class="wrap">
  <h1>문의</h1>
  <p class="sub">궁금한 점, 불편한 점, 요청 사항을 남겨 주세요. 본사에서 확인 후 연락드립니다.</p>
  <div class="who" id="who" hidden></div>
  <form id="f" novalidate autocomplete="off">
    <div class="f-label">문의 종류</div>
    <div class="types" id="types"></div>

    <label class="f" for="title">제목</label>
    <input type="text" id="title" maxlength="100" placeholder="한 줄로 요약해 주세요">

    <label class="f" for="body">내용</label>
    <textarea id="body" maxlength="5000" placeholder="품번·컬러·상황 등 가능한 자세히 적어 주세요"></textarea>

    <label class="f" for="contact">연락처 <span class="opt">(선택)</span></label>
    <input type="text" id="contact" maxlength="100" placeholder="회신받을 전화번호 또는 이메일">

    <div class="f-label">사진 <span class="opt">(선택, 최대 5장)</span></div>
    <button type="button" class="add" id="add">+ 사진 추가</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs"></div>

    <div class="hp" aria-hidden="true"><label for="hp">비워 두세요</label><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>

    <button type="submit" class="send" id="send">보내기</button>
    <div class="msg" id="msg" hidden role="status"></div>
  </form>
</div>
<script>
(function () {
  // ponytail: 엔드포인트 URL은 공개돼도 되는 값(요청 제한·키로 방어). 이메일 주소는 스크립트 안에만 있음.
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbz06aEQ6ymbHLpHZKnqVOd2UDWrPbpD4WEx7OoOm3aCPh94f3WKcdwd-_G13KK34bJBHw/exec';
  var KEY = 'guide-inquiry-v1';
  var TYPES = ['상품 문의', '불량 문의', '사이트 오류', '요청 사항', '기타'];
  var MAX = 5, SIDE = 1600;
  var $ = function (id) { return document.getElementById(id); };
  var photos = []; // {data: base64, url: objectURL}

  var store = '';
  try { store = (JSON.parse(localStorage.getItem('dg_auth_v1')) || {}).code || ''; } catch (e) {}
  if (store) { $('who').textContent = '매장 ' + store; $('who').hidden = false; }

  $('types').innerHTML = TYPES.map(function (t, i) {
    return '<label><input type="radio" name="type" value="' + t + '"' + (i === 0 ? ' checked' : '') + '><span>' + t + '</span></label>';
  }).join('');

  function show(kind, text) { var m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; m.hidden = false; }

  function render() {
    $('thumbs').innerHTML = '';
    photos.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'th';
      var im = document.createElement('img'); im.src = p.url; im.alt = '첨부 사진 ' + (i + 1);
      var b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', '사진 삭제');
      b.onclick = function () { URL.revokeObjectURL(p.url); photos.splice(i, 1); render(); };
      d.appendChild(im); d.appendChild(b); $('thumbs').appendChild(d);
    });
    $('add').hidden = photos.length >= MAX;
  }

  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, SIDE / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (blob) {
          if (!blob) return rej();
          var r = new FileReader();
          r.onload = function () { res({ data: String(r.result).split(',')[1], url: URL.createObjectURL(blob) }); };
          r.readAsDataURL(blob);
        }, 'image/jpeg', 0.8);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }

  $('add').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var list = Array.prototype.slice.call(this.files).slice(0, MAX - photos.length);
    this.value = '';
    list.reduce(function (p, f) {
      return p.then(function () { return shrink(f).then(function (x) { photos.push(x); }, function () { show('err', '사진 한 장을 불러오지 못했습니다. 다른 사진으로 시도해 주세요.'); }); });
    }, Promise.resolve()).then(render);
  };

  $('f').onsubmit = function (ev) {
    ev.preventDefault();
    $('msg').hidden = true;
    var title = $('title').value.trim(), body = $('body').value.trim();
    if (!title) { show('err', '제목을 입력해 주세요.'); $('title').focus(); return; }
    if (!body) { show('err', '내용을 입력해 주세요.'); $('body').focus(); return; }
    if (!ENDPOINT) { show('err', '문의 접수가 아직 준비되지 않았습니다.'); return; }
    var btn = $('send'); btn.disabled = true; btn.textContent = '보내는 중…';
    var payload = {
      key: KEY, hp: $('hp').value, store: store,
      type: document.querySelector('input[name=type]:checked').value,
      title: title, body: body, contact: $('contact').value.trim(),
      photos: photos.map(function (p) { return { data: p.data }; })
    };
    // text/plain → CORS 사전 요청 없이 전송
    fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) {
          $('f').reset(); photos.forEach(function (p) { URL.revokeObjectURL(p.url); }); photos = []; render();
          show('ok', '접수되었습니다. 확인 후 연락드리겠습니다.');
        } else if (j.msg === 'rate') show('err', '짧은 시간에 너무 많이 보냈습니다. 잠시 후 다시 시도해 주세요.');
        else show('err', '전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
      })
      .catch(function () { show('err', '네트워크 오류로 전송하지 못했습니다. 연결을 확인하고 다시 시도해 주세요. (작성한 내용은 그대로 남아 있습니다)'); })
      .then(function () { btn.disabled = false; btn.textContent = '보내기'; });
  };
  render();
})();
</script>
<script src="fs.js"></script>
</body>
</html>
